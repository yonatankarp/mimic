# Builds the engine tarball the app downloads (pixal3d.cpp for Metal, patched to honour
# PIXAL3D_STEPS) with tools/package_pixal3d.sh, twice, in different folders, and fails unless
# both builds are byte for byte the same. It never publishes: the tarball is a workflow
# artifact, for the maintainer to check and upload by hand (CONTRIBUTING.md).
name: Engine

on:
  workflow_dispatch:
    inputs:
      commit:
        description: pixal3d.cpp commit to build (full sha)
        default: d1b4926452f9e09702b891db5f05acc845e153ed
  pull_request:
    paths:
      - tools/package_pixal3d.sh
      - tools/pixal3d-steps.patch
      - tools/LICENSE-image-to-3dlab
      - .github/workflows/engine.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull requests build the commit Mimic pins today (EngineDownload.engine).
  PIXAL3D_COMMIT: ${{ inputs.commit || 'd1b4926452f9e09702b891db5f05acc845e153ed' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      matrix:
        # Two different folders: the same tarball from both shows no path leaks into it.
        where: [a, elsewhere/deeper/b]
    env:
      # One Xcode, as in release.yml: VERSION records it, and another compiler is another build.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mimic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raven38/pixal3d.cpp
          ref: ${{ env.PIXAL3D_COMMIT }}
          path: ${{ matrix.where }}/pixal3d.cpp
          submodules: true
          persist-credentials: false
      - name: Ninja
        # A pinned ninja, checked by its sha256, rather than whichever one brew has today.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ninja-mac.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
          echo "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b  $RUNNER_TEMP/ninja-mac.zip" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/ninja" && unzip -q "$RUNNER_TEMP/ninja-mac.zip" -d "$RUNNER_TEMP/ninja"
          echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version | head -1
          ninja --version
      - name: Build and package
        env:
          WHERE: ${{ matrix.where }}
        run: mimic/tools/package_pixal3d.sh "$WHERE/pixal3d.cpp" "$RUNNER_TEMP/$WHERE/build" dist
      - name: Summary
        env:
          WHERE: ${{ matrix.where }}
        run: |
          {
            echo "### $WHERE"
            echo '```text'
            cat dist/*.sha256
            tar -xzOf dist/*.tar.gz --include '*/VERSION'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ strategy.job-index }}
          path: dist/*

  compare:
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-*
      - name: Same tarball from both builds
        run: |
          # Every file's sha256 first, so a mismatch says which file differs.
          for d in engine-0 engine-1; do
            mkdir "$d/x" && tar -xzf "$d"/*.tar.gz -C "$d/x"
            (cd "$d/x" && find . -type f | LC_ALL=C sort | xargs shasum -a 256)
          done
          cat engine-0/*.sha256 engine-1/*.sha256
          cmp engine-0/*.tar.gz engine-1/*.tar.gz
          echo "Reproducible: $(cut -d' ' -f1 engine-0/*.sha256)" | tee -a "$GITHUB_STEP_SUMMARY"

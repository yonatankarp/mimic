# Release notes are written from pull requests (tools/release_notes.py), so each title starts with
# the kind of change it is.
name: Pull request title

on:
  pull_request_target:  # reads the title only, never checks out the pull request's code
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            change
            docs
            chore
            ci
            test
            refactor

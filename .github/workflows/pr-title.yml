# Release notes are written from pull requests (the shared release-notes action), so each title
# starts with the kind of change it is.
name: Pull request title

on:
  pull_request_target:  # reads the title only, never checks out the pull request's code
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: yonatankarp/github-actions/.github/workflows/pr-title.yml@1badbe33ad352c1569d7ac32fdd8a972fc292678 # v2
    with:
      kinds: feat,change,fix,docs,chore,ci,test,refactor

# Tests every change, builds the disk image (except for pull requests), and drafts a release
# when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # daily: a download deleted by hand breaks installs without any push

permissions:
  contents: read

# A new push to a pull request stops its older build. Everything else (main, tags, the daily run)
# gets a group of its own, so it always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # macOS 26's SDK: the Liquid Glass look is compiled against it.
    runs-on: macos-26
    timeout-minutes: 30
    # The signing secrets can live in the release environment, which only version tags may use.
    # Every other build runs without an environment, so a tag-only rule there never blocks it.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      # One Xcode, not whatever the image defaults to: compilers differ (Package.swift's slowCode).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the packagers name builds by commit
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        working-directory: app
        run: swift test --force-resolved-versions --enable-code-coverage
      - name: Strings
        # Every word the code looks up is in the String Catalog, and nothing else is (app/strings.py).
        working-directory: app
        run: ./strings.py --check
      - name: Coverage
        # MimicCore's line coverage, on the run's summary page. Only a report: it never fails the
        # build. Rough, since MimicCore is optimised in debug builds too (Package.swift).
        working-directory: app
        continue-on-error: true
        run: |
          bin="$(swift build --show-bin-path)"
          tests=("$bin"/*.xctest/Contents/MacOS/*)
          {
            echo '### MimicCore test coverage'
            echo '```text'
            xcrun llvm-cov report "${tests[0]}" -instr-profile "$bin/codecov/default.profdata" \
              -ignore-filename-regex '(Tests|\.build)/' Sources/MimicCore
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check downloads
        # Every pinned download is still there. It asks GitHub and Hugging Face live, so it runs on
        # the daily build, a manual run and before a release, never on a pull request: an outage
        # there isn't the pull request's fault.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          MIMIC_CHECK_DOWNLOADS: "1"
        # The same flags as Test, so it reuses that build.
        run: swift test --force-resolved-versions --enable-code-coverage --filter SetupTests/testEveryPinnedDownloadIsReachable
      - name: Set up signing
        # Mimic's own certificate (made by the maintainer, not Apple's): every release is signed
        # by the same signer, so macOS treats an update as the same app. Only version tags load
        # it: pull requests, main and the daily build are signed ad hoc, so a branch can't ship
        # code signed as Mimic. A release without the certificate fails below.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          P12: ${{ secrets.MIMIC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MIMIC_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No signing certificate: building ad hoc."; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-made certificate signs only once it's trusted for code signing on this machine.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -passin env:P12_PASSWORD -legacy -out "$RUNNER_TEMP/signing.crt" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/signing.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.crt"
          rm -f "$RUNNER_TEMP/signing.p12"
          identity="$(openssl x509 -in "$RUNNER_TEMP/signing.crt" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          echo "MIMIC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MIMIC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package
        # A release build (~2 min), so not on pull requests: main checks it after every merge,
        # and a tag always runs it.
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "A version tag looks like v1.2.3, not $GITHUB_REF_NAME."; exit 1; }
            export MIMIC_VERSION="${GITHUB_REF_NAME#v}"
            [ -n "${MIMIC_SIGN_IDENTITY:-}" ] || { echo "A release must be signed with Mimic's certificate."; exit 1; }
          fi
          tools/package_dmg.sh dist
          # Signed by Mimic's certificate, not ad hoc, whenever it was set up.
          if [ -n "${MIMIC_SIGN_IDENTITY:-}" ]; then
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
            codesign -dvv "$RUNNER_TEMP/dmg/Mimic.app" 2>&1 | grep -E "Authority=Mimic"
            codesign --verify --strict "$RUNNER_TEMP/dmg/Mimic.app"
            hdiutil detach "$RUNNER_TEMP/dmg"
          fi
      - name: Check hardened runtime
        if: github.event_name != 'pull_request'
        # The app in the disk image, and an ad hoc dev build (how anyone builds it on their own
        # Mac), are signed with the hardened runtime inside out, and still start: Sparkle loads
        # before main, so `--version` would crash here if the runtime refused it.
        run: |
          check() {
            local app="$1"
            codesign --verify --deep --strict "$app"
            for code in "$app" "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"; do
              flags="$(codesign -dv "$code" 2>&1 | grep -E '^CodeDirectory')"
              echo "$code: $flags"
              [[ "$flags" == *runtime* ]] || { echo "$code isn't signed with the hardened runtime."; exit 1; }
            done
            codesign -d --entitlements - "$app"
            codesign -d -r- "$app"
            "$app/Contents/MacOS/mimic" --version | grep .
          }
          mnt="$RUNNER_TEMP/hardened"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/*.dmg
          check "$mnt/Mimic.app"
          hdiutil detach "$mnt"
          MIMIC_SIGN_IDENTITY= app/bundle.sh
          check "app/build/Mimic Dev.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: mimic
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: release  # SPARKLE_PRIVATE_KEY can live there, beside the signing certificate
    # macOS: Sparkle's tools read the app inside the disk image.
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      id-token: write  # signs the provenance below with a short-lived Sigstore certificate
      attestations: write  # stores it, where `gh attestation verify` finds it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the notes list the pull requests merged since the last tag
          persist-credentials: false  # gh publishes with GH_TOKEN; git never pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mimic
          path: dist
      - name: Release notes
        # Written from the pull requests merged since the last version (tools/release_notes.py);
        # 0.7.0 and before use their section of CHANGELOG.md.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Appcast
        # What Mimic's updater (Sparkle) reads: the new version, its disk image signed with
        # Sparkle's key, and the release notes. Published with each release, so
        # releases/latest/download/appcast.xml is always the newest. Its download links are the
        # tag's, which work once the draft is published.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "No SPARKLE_PRIVATE_KEY: a release needs its appcast."; exit 1; }
          # The same Sparkle version as app/Package.resolved, which Dependabot bumps but can't
          # follow here: when it moves, update this version and the tarball's sha256 to match.
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/appcast"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          # Its own folder: generate_appcast reads every file there, and writes beside them.
          dmg="$(cd dist && ls Mimic-*.dmg)"
          cp "dist/$dmg" "$RUNNER_TEMP/appcast/"
          cp notes.md "$RUNNER_TEMP/appcast/${dmg%.dmg}.md"
          # The key goes in on stdin, never on the command line or in a file.
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "$RUNNER_TEMP/appcast" <<< "$SPARKLE_PRIVATE_KEY"
          # A key that doesn't match the app's SUPublicEDKey only warns, and leaves the update unsigned.
          grep -q 'sparkle:edSignature=' "$RUNNER_TEMP/appcast/appcast.xml" || { echo "The appcast isn't signed: SPARKLE_PRIVATE_KEY doesn't match SUPublicEDKey."; exit 1; }
          cp "$RUNNER_TEMP/appcast/appcast.xml" dist/
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 -- * > SHA256SUMS
      - name: Provenance
        # Proves the disk image was built by this workflow from this tag, which a first install
        # can check before Sparkle's signature ever applies (CONTRIBUTING.md, Releasing). Made
        # before the draft, so a release never goes out without it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Mimic-*.dmg
            dist/SHA256SUMS
      - name: Publish
        # A draft, never "latest", so no Mimic sees it until the maintainer checks it and clicks
        # Publish (CONTRIBUTING.md, Releasing).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "Mimic $version" --notes-file ../notes.md --draft

# Tests every change, builds the disk image, and publishes a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 26's SDK: the Liquid Glass look is compiled against it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the packagers name builds by commit
      - name: Test
        working-directory: app
        run: swift test
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export MIMIC_VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/package_dmg.sh dist
          tools/package_app.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimic
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mimic
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Mimic ${GITHUB_REF_NAME#v}" --generate-notes

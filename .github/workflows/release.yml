# Tests every change, builds the disk image, and publishes a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # daily: a download deleted by hand breaks installs without any push

permissions:
  contents: read

jobs:
  build:
    # macOS 26's SDK: the Liquid Glass look is compiled against it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the packagers name builds by commit
      - name: Test
        working-directory: app
        env:
          MIMIC_CHECK_DOWNLOADS: "1"  # every pinned download is still there
        run: swift test
      - name: Set up signing
        # Mimic's own certificate (made by the maintainer, not Apple's): every release is signed
        # by the same signer, so macOS treats an update as the same app. Pull requests from forks
        # have no secrets and are signed ad hoc; a release without the certificate fails below.
        env:
          P12: ${{ secrets.MIMIC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MIMIC_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No signing certificate: building ad hoc."; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-made certificate signs only once it's trusted for code signing on this machine.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -passin env:P12_PASSWORD -legacy -out "$RUNNER_TEMP/signing.crt" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/signing.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.crt"
          rm -f "$RUNNER_TEMP/signing.p12"
          identity="$(openssl x509 -in "$RUNNER_TEMP/signing.crt" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          echo "MIMIC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MIMIC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MIMIC_VERSION="${GITHUB_REF_NAME#v}"
            [ -n "${MIMIC_SIGN_IDENTITY:-}" ] || { echo "A release must be signed with Mimic's certificate."; exit 1; }
          fi
          tools/package_dmg.sh dist
          # Signed by Mimic's certificate, not ad hoc, whenever it was set up.
          if [ -n "${MIMIC_SIGN_IDENTITY:-}" ]; then
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
            codesign -dvv "$RUNNER_TEMP/dmg/Mimic.app" 2>&1 | grep -E "Authority=Mimic"
            codesign --verify --strict "$RUNNER_TEMP/dmg/Mimic.app"
            hdiutil detach "$RUNNER_TEMP/dmg"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimic
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # macOS: Sparkle's tools read the app inside the disk image.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mimic
          path: dist
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md: GitHub's generated
          # notes list merged pull requests, and Mimic's changes don't arrive as pull requests.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Appcast
        # What Mimic's updater (Sparkle) reads: the new version, its disk image signed with
        # Sparkle's key, and the release notes. Published with each release, so
        # releases/latest/download/appcast.xml is always the newest.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "No SPARKLE_PRIVATE_KEY: a release needs its appcast."; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/appcast"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          # Its own folder: generate_appcast reads every file there, and writes beside them.
          dmg="$(cd dist && ls Mimic-*.dmg)"
          cp "dist/$dmg" "$RUNNER_TEMP/appcast/"
          cp notes.md "$RUNNER_TEMP/appcast/${dmg%.dmg}.md"
          # The key goes in on stdin, never on the command line or in a file.
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "$RUNNER_TEMP/appcast" <<< "$SPARKLE_PRIVATE_KEY"
          # A key that doesn't match the app's SUPublicEDKey only warns, and leaves the update unsigned.
          grep -q 'sparkle:edSignature=' "$RUNNER_TEMP/appcast/appcast.xml" || { echo "The appcast isn't signed: SPARKLE_PRIVATE_KEY doesn't match SUPublicEDKey."; exit 1; }
          cp "$RUNNER_TEMP/appcast/appcast.xml" dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          shasum -a 256 * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Mimic $version" --notes-file ../notes.md
